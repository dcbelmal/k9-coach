name: Zbuduj aplikację

# Dwa osobne etapy:
#  1. „Sprawdzenie” – każdy PR i push: analiza, testy i kompilacja testowa (debug).
#     Bez dostępu do sekretów i bez prawa zapisu do repozytorium.
#  2. „Wydanie” – tylko push do main (lub ręcznie z main): podpisany APK
#     i publikacja „najnowsza”. Tylko ten etap ma sekrety i prawo zapisu.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Sprawdzenie (analiza, testy, kompilacja)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Analiza kodu
        run: flutter analyze --no-fatal-infos
      - name: Testy
        run: flutter test
      - name: Kompilacja testowa (debug, bez klucza wydania)
        run: flutter build apk --debug --dart-define=VALKOR_FLAVOR=beta

  release:
    name: Wydanie (podpisany APK)
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Przygotuj klucz podpisu
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Brak sekretu KEYSTORE_PASSWORD. Bez niego APK nie zainstaluje się na poprzednią wersję."
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Klucz z sekretu (zalecane) – plik tylko na czas budowy, poza repozytorium.
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/valkor-release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/valkor-release.p12" >> "$GITHUB_ENV"
            echo "Klucz podpisu: z sekretu KEYSTORE_BASE64"
          elif [ -f android/app/valkor-release.p12 ]; then
            echo "::warning::Klucz podpisu wczytany z pliku w repozytorium. Dodaj sekret KEYSTORE_BASE64 i usuń plik z repozytorium."
          else
            echo "::error::Brak klucza podpisu (sekret KEYSTORE_BASE64 albo plik android/app/valkor-release.p12)."
            exit 1
          fi
      - name: Zbuduj APK (beta)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release --dart-define=VALKOR_FLAVOR=beta
      - name: Sprawdź, że APK ma ten sam podpis co poprzednie wersje
        run: python3 tool/apk_cert.py build/app/outputs/flutter-apk/app-release.apk "$(cat android/app/release-cert.sha256)"
      - name: Usuń plik klucza
        if: always()
        run: rm -f "$RUNNER_TEMP/valkor-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: Valkor-Coach-Android
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk Valkor-Coach.apk
          cp build/app/outputs/flutter-apk/app-release.apk K9-Coach.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          name: Valkor Coach – najnowsza wersja
          make_latest: true
          body: Plik Valkor-Coach.apk do zainstalowania na telefonie z Androidem (K9-Coach.apk to ten sam plik pod starą nazwą).
          files: |
            Valkor-Coach.apk
            K9-Coach.apk
