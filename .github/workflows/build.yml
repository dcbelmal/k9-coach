name: Zbuduj aplikację

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Valkor-Coach-Android
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk Valkor-Coach.apk
          cp build/app/outputs/flutter-apk/app-release.apk K9-Coach.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          name: Valkor Coach – najnowsza wersja
          make_latest: true
          body: Plik Valkor-Coach.apk do zainstalowania na telefonie z Androidem (K9-Coach.apk to ten sam plik pod starą nazwą).
          files: |
            Valkor-Coach.apk
            K9-Coach.apk
