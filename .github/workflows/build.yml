name: Zbuduj aplikację

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Sprawdź klucz podpisu
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Brak sekretu KEYSTORE_PASSWORD. Bez niego APK nie zainstaluje się na poprzednią wersję."
            exit 1
          fi
      - run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Valkor-Coach-Android
          path: build/app/outputs/flutter-apk/app-release.apk
      # Wersję „najnowsza” publikujemy tylko z gałęzi main (PR tylko sprawdza, czy się buduje).
      - if: github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Valkor-Coach.apk
          cp build/app/outputs/flutter-apk/app-release.apk K9-Coach.apk
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          name: Valkor Coach – najnowsza wersja
          make_latest: true
          body: Plik Valkor-Coach.apk do zainstalowania na telefonie z Androidem (K9-Coach.apk to ten sam plik pod starą nazwą).
          files: |
            Valkor-Coach.apk
            K9-Coach.apk
